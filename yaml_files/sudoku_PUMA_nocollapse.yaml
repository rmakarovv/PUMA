# PUMA without collapse: identical to sudoku_PUMA_reference.yaml (stock PUMA, K = 10) except that
# confidence fast-forwarding is off, so each step reveals only the scheduled top-confidence tokens.
model:
  vocab_size: 11
  hidden_size: 256
  intermediate_size: 768
  num_layers: 8
  num_attention_heads: 8
  num_kv_heads: 8
  max_position: 81
  rms_norm_eps: 1e-6
  dropout: 0.0

training:
  strategy: "progressive"
  diffusion_layout: "full"
  prompt_only_reset: true # restart recycled chains from the clue-only puzzle
  confidence_threshold: null # PUMA reference: 0.9
  mode: "standard" # PUMA reference: confidence_collapse
  K: 10 # nominal tokens unmasked per stage at reference_length
  reference_length: 81
  data_ratio: 1.0
  learning_rate: 3e-4
  weight_decay: 0.01
  num_epochs: 2
  max_grad_norm: 1.0
  batch_size: 32
  warmup_steps: 1000
  logging_steps: 100
  eval_steps: 1000 # proposal protocol: evaluate every 1,000 updates (PUMA config: 2000)
  save_steps: 10000
  ema: 0.9999
  eos_id: null

validation:
  val_dir: "data/sudoku_new"
  ratio: 0.01
  sampling: 
    temperature: 0.0
    confidence: ["top_k", "top_k_margin"]
    unmasking_num: [1, 2, 3]

data:
  mask_id: 10
  dataset: "sudoku"
  data_dir: "data/sudoku_new"
  sudoku_type: "new"
  val_ratio: 0.05
  seed: 2026
  mmap: false
  training:
    per_gpu_batch_size: ${training.batch_size}
    cpus: 4

wandb:
  wandb: false # metrics go to <ckpt_dir>/metrics.jsonl
  project: "mdm-pretraining"
  name: "sudoku-PUMA-nocollapse"
  entity: "your-entity-here"
